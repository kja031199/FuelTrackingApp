name: CodeQL

# Static security analysis for Swift (#84).
#
# This is not a second linter. SwiftLint checks style and a few crash-prone
# constructs line by line; CodeQL builds a database of the whole program and
# asks dataflow questions — can attacker-controlled input reach this sink, is
# this path reachable at all. It complements the hostile-input test suite:
# the tests prove behaviour on inputs someone thought of, CodeQL looks for the
# paths nobody thought of.
#
# Free for public repositories, which is what made it available here.
#
# Two things to know before touching this file:
#
#   - **Swift analysis needs a macOS runner and a real build.** CodeQL cannot
#     analyse Swift from source text alone; it observes an actual compile. So
#     this job is slower than `ci.yml`, and it compiles the shared layer twice
#     (once for iOS, once for the embedded watch target) exactly as CI does.
#   - **It is deliberately NOT a required status check.** A first CodeQL run on
#     an untouched codebase is rarely silent, and a security scanner that blocks
#     merges before anyone has triaged its output trains people to bypass it.
#     Make it required once it has been quiet for a while.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:00 UTC — an hour after the link check, so a slow week of
    # scheduled jobs doesn't stack. Periodic runs matter because CodeQL's query
    # packs are updated independently of this repo: unchanged code can acquire
    # a new finding when a new query ships.
    - cron: '0 7 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level floor, so a job added later inherits least privilege rather
# than the repository default. The analyze job widens this for itself.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 30

    # Least privilege, as everywhere else here — but this workflow genuinely
    # needs more than `contents: read`: uploading results to the Security tab
    # requires `security-events: write`. Scoped to the job rather than the
    # workflow so the extra scope sits next to the step that needs it.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          # `security-and-quality` is a superset of the default suite: it adds
          # maintainability and correctness queries on top of the security ones.
          # Chosen because this project's bar ("never crash, never divide by
          # zero, never fabricate a statistic") is as much correctness as
          # security. Drop to `security-extended` or the default if the quality
          # queries prove noisy.
          queries: security-and-quality

      # An explicit build rather than `autobuild`. Autobuild guesses at the
      # scheme, and this project has an embedded watchOS target plus a test
      # target — a wrong guess would analyse the wrong thing and report a
      # confident, meaningless result. Mirroring ci.yml's invocation keeps the
      # analysed build and the tested build in step.
      #
      # `build-for-testing` is deliberate: it compiles the app *and* the test
      # target without running anything, so CodeQL sees all the source ci.yml
      # exercises. No simulator is booted and no test executes here.
      - name: Build
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project FuelTracker.xcodeproj \
            -scheme FuelTracker \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
