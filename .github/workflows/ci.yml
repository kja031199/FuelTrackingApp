name: CI

# Builds the app and runs the Swift Testing suite on an iOS Simulator for every
# pull request, so changes are actually executed rather than only reviewed.
#
# No paid Apple Developer account is required: Simulator builds don't need code
# signing or a development team (DEVELOPMENT_TEAM ships empty), so this works on
# the same free-account setup the project targets.
#
# This workflow runs on **every** pull request, including docs-only ones (#83).
#
# It used to skip Markdown and `docs/**` via `paths-ignore`, purely to save
# money: a private repo billed macOS at 10x against a ~200 macOS-minute monthly
# allowance, and a Markdown edit can't break the build. The repo is public now
# and standard runners are free, so that saving is worth nothing — while its
# cost was real. A skipped run reports **no status at all**, and a check that
# sometimes reports nothing can never be a *required* check, because a docs-only
# PR would wait forever for a result that never arrives.
#
# Trading a ~6.5-minute run on docs PRs for a branch protection rule that can
# actually block a red build is the whole point. Don't reintroduce
# `paths-ignore` here without also giving up required-check status.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN: this job only ever reads the checkout.
# Pinned explicitly rather than inherited from the repository default, which is
# a setting that can be changed elsewhere without anyone touching this file.
# It matters most on a public repo, where anyone can open a pull request and
# have their code executed by this workflow. `checks.yml` pins the same.
permissions:
  contents: read

jobs:
  test:
    name: Build & test (iOS Simulator)
    # `macos-latest` keeps the toolchain current with no maintenance. Pin it
    # (e.g. `macos-15`) if you'd rather have byte-reproducible runs.
    runs-on: macos-latest
    # A healthy run is ~6.5 minutes end to end. The cap is about bounding a hang,
    # not billing (runs are free on a public repo) — a wedged process should fail
    # fast rather than sit for six hours holding the branch hostage. Per-step
    # timeouts below fail even faster and say *where* it stuck.
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        timeout-minutes: 3
        run: |
          xcodebuild -version
          swift --version
          # Confirmed from a real run: the WatchSimulator SDK is already present
          # on the image, so the embedded watch build does NOT trigger a runtime
          # download — it just costs a second compile of the shared layer.
          # Kept as a cheap canary in case a future image drops it.
          xcrun simctl runtime list || true

      # Simulator device names change with each Xcode release, so resolve one
      # at run time instead of hard-coding "iPhone 16".
      - name: Pick an iOS Simulator
        id: simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid] | last // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone Simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          name=$(xcrun simctl list devices available --json \
            | jq -r --arg udid "$udid" '[.devices[][] | select(.udid == $udid) | .name] | first')
          echo "Using simulator: $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Boot here rather than letting `xcodebuild test` do it implicitly, so
          # a slow or wedged boot is attributed to this step (with its own
          # timeout) instead of hiding inside the build-and-test step.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      # Measured on a real run: the build takes ~60 seconds and the suite runs in
      # seconds. (An earlier comment here blamed a "20-minute build" — that was
      # wrong; a timestamped log showed compilation finishing a minute in, with
      # the time going to a hung *test* run. Don't re-tune the build on a hunch.)
      #
      # Note the iOS target has an "Embed Watch Content" phase and an explicit
      # dependency on the watch app, so this also compiles the whole shared layer
      # a second time for watchOS. That can't be switched off from the command
      # line; issue #76 tracks the structural fix.
      #
      # The flags below trim work that only matters to Xcode's UI, not to CI:
      #   COMPILER_INDEX_STORE_ENABLE=NO  skip index-while-building
      #   ONLY_ACTIVE_ARCH=YES            build one slice, not a fat binary
      #   -enableCodeCoverage YES         profiling instrumentation. This was NO
      #                                   to save billed minutes; with runs free
      #                                   the trade flipped, and 422 tests had
      #                                   never reported a coverage number (#85).
      #   -skipMacroValidation            don't re-validate macro fingerprints
      #   -parallel-testing-enabled NO    run the suite serially. The screens are
      #                                   hosted in a real UIWindow on the main
      #                                   actor, so parallel workers buy nothing
      #                                   here and cost interleaved output — with
      #                                   one worker the last test named in the
      #                                   log is the one that stuck.
      #   NSUnbufferedIO=YES              stream output as it happens, so a hang
      #                                   doesn't swallow the preceding lines.
      #
      # Deliberately NOT used: -test-timeouts-enabled /
      # -default-test-execution-time-allowance. Those bound *XCTest* cases only;
      # this suite is Swift Testing, which ignores them (it wants a `.timeLimit`
      # trait on the test instead). They were tried, and a hung run sailed past
      # them — the step timeout below is what actually bounds the damage.
      - name: Build and test
        timeout-minutes: 12
        run: |
          set -euo pipefail
          NSUnbufferedIO=YES xcodebuild test \
            -project FuelTracker.xcodeproj \
            -scheme FuelTracker \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      # Informational only — this must never turn a passing build red. A missing
      # or malformed result bundle, or a changed `xccov` interface, is not a test
      # failure, so every command is tolerant and the step ends with `true`.
      # `if: success()` keeps it from adding noise to an already-failing job.
      - name: Coverage summary
        if: ${{ success() }}
        timeout-minutes: 3
        run: |
          if [ ! -d TestResults.xcresult ]; then
            echo "No result bundle; skipping coverage report."
            exit 0
          fi
          # --report prints per-target and per-file percentages. Capture first,
          # then branch on the real exit status: inside a pipeline the status
          # would come from `tee`, which masks an xccov failure entirely.
          if xcrun xccov view --report TestResults.xcresult > coverage.txt 2>&1; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Coverage (xccov failed — reporting only, build unaffected)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          true

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
          # A step timeout kills xcodebuild mid-write, so the bundle may be
          # absent or partial. Warn rather than fail — the job has already
          # failed for the real reason and this shouldn't mask it.
          if-no-files-found: warn
