name: CI

# Builds the app and runs the Swift Testing suite on an iOS Simulator for every
# pull request, so changes are actually executed rather than only reviewed.
#
# No paid Apple Developer account is required: Simulator builds don't need code
# signing or a development team (DEVELOPMENT_TEAM ships empty), so this works on
# the same free-account setup the project targets.
#
# Docs-only changes skip this workflow. On a private repo macOS runners bill at
# a 10x multiplier against the monthly Actions allowance, and a Markdown edit
# can't break the build, so spending ~10 minutes of quota on one is waste.
# Deliberately NOT ignored: `.github/**`, so a change to this workflow is still
# validated by running it. (Revisit `**/*.md` if a DocC build check is ever
# added — DocC articles are Markdown and could then affect the result.)
#
# Note: because skipped runs report no status, don't make this a *required*
# status check while `paths-ignore` is in place — a docs-only PR would wait
# forever for a check that never runs.

# (The two lists are duplicated on purpose: GitHub Actions doesn't support YAML
# anchors/aliases, so keep them in sync by hand.)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (iOS Simulator)
    # `macos-latest` keeps the toolchain current with no maintenance. Pin it
    # (e.g. `macos-15`) if you'd rather have byte-reproducible runs.
    runs-on: macos-latest
    # Deliberately tight: macOS minutes bill at 10x, so a hung or pathologically
    # slow run should fail fast rather than quietly burn the monthly allowance.
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          # Which simulator runtimes are already installed? If watchOS is
          # missing, building the embedded watch app makes Xcode fetch it on
          # demand, which can dominate the run time.
          xcrun simctl runtime list || true

      # Simulator device names change with each Xcode release, so resolve one
      # at run time instead of hard-coding "iPhone 16".
      - name: Pick an iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid] | last // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone Simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          name=$(xcrun simctl list devices available --json \
            | jq -r --arg udid "$udid" '[.devices[][] | select(.udid == $udid) | .name] | first')
          echo "Using simulator: $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The suite itself runs in ~10 seconds; essentially all of this step is
      # compilation. Note the iOS target has an "Embed Watch Content" phase and
      # an explicit dependency on the watch app, so this also compiles the whole
      # shared layer a second time for watchOS. That can't be switched off from
      # the command line; issue #76 tracks the structural fix.
      #
      # The flags below trim work that only matters to Xcode's UI, not to CI:
      #   COMPILER_INDEX_STORE_ENABLE=NO  skip index-while-building
      #   ONLY_ACTIVE_ARCH=YES            build one slice, not a fat binary
      #   -enableCodeCoverage NO          skip profiling instrumentation
      #                                   (coverage still available locally ⌘U)
      #   -skipMacroValidation            don't re-validate macro fingerprints
      # -showBuildTimingSummary prints where the time actually goes, so the next
      # round of tuning is measured rather than guessed.
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project FuelTracker.xcodeproj \
            -scheme FuelTracker \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage NO \
            -skipMacroValidation \
            -showBuildTimingSummary \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
